<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <div class="head">
            <h1>Finance Tracker</h1>
            <p>Track your income and expenses</p>
        </div>

        <div class="cards">
            <div class="card balance">
                <span class="label">Total Balance</span>
                <h2 id="balance">₹0</h2>
            </div>
            <div class="card income">
                <span class="label">Total Income</span>
                <h2 id="income">₹0</h2>
            </div>
            <div class="card expense">
                <span class="label">Total Expenses</span>
                <h2 id="expense">₹0</h2>
            </div>
        </div>

        <div class="box">
            <h2>Add Transaction</h2>
            <form id="form">
                <div class="row">
                    <div class="group">
                        <label>Description</label>
                        <input type="text" id="title" placeholder="Enter Description">
                    </div>
                    <div class="group">
                        <label>Amount</label>
                        <input type="number" id="amount" placeholder="Enter amount">
                    </div>
                </div>
                <div class="row">
                    <div class="group">
                        <label>Type</label>
                        <select id="type">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="group">
                        <label>Category</label>
                        <select id="category">
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                            <option value="Salary">Salary</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="group">
                    <label>Date</label>
                    <input type="date" id="date">
                </div>
                <button class="addbtn" type="submit">
                    Add Transaction
                </button>
            </form>
        </div>

        <div class="box">
            <h2>Transactions</h2>
            <div class="filters">
                <input type="text" id="search" placeholder="Search by title">
                <select id="typefilter">
                    <option value="all">All Types</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
                <select id="catfilter">
                    <option value="all">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Salary">Salary</option>
                    <option value="Other">Other</option>
                </select>
                <select id="sort">
                    <option value="dateDesc">Latest First</option>
                    <option value="dateAsc">Oldest First</option>
                    <option value="amountDesc">Highest Amount</option>
                    <option value="amountAsc">Lowest Amount</option>
                </select>
            </div>

            <div id="list" class="list"></div>
            <p id="empty" class="empty">No transactions found.</p>
        </div>
    </div>


    <div id="modal" class="modal hide">
        <div class="modalbox">
            <h2>Edit Transaction</h2>
            <form id="editform">
                <input type="hidden" id="editid">
                <div class="group">
                    <label>Title / Description</label>
                    <input type="text" id="edittitle">
                </div>
                <div class="group">
                    <label>Amount</label>
                    <input type="number" id="editamount">
                </div>
                <div class="group">
                    <label>Type</label>
                    <select id="edittype">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="group">
                    <label>Category</label>
                    <select id="editcat">
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Salary">Salary</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="group">
                    <label>Date</label>
                    <input type="date" id="editdate">
                </div>
                <div class="actions">
                    <button type="button" id="cancel" class="cancel">
                        Cancel
                    </button>
                    <button type="submit" class="save">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    
    <script src="script.js"></script>

</body>
</html>
